<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0E1114" />
<title>Shelf — IEB matric finals</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="./config.js"></script>
<style>
  html, body, #root { min-height: 100%; background: #0E1114; }
  body { margin: 0; font-family: 'Inter Tight', system-ui, sans-serif; color: #E9ECEF; -webkit-font-smoothing: antialiased; }
  ::selection { background: #E0B252; color: #171310; }
  input, textarea { color-scheme: dark; }
  input:focus-visible, button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid #E0B252; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  @media print { .no-print { display: none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------------- tokens ---------------- */
const C = {
  bg: "#0E1114", surface: "#161A1F", raised: "#1C222A", line: "#272E37",
  text: "#E9ECEF", muted: "#8B959F", gold: "#E0B252", danger: "#C25C5C",
};
const PALETTE = ["#1F9E8F","#8C3049","#C06B3E","#3070A8","#3E8A63","#6155A8","#A98C34","#9C4F7C"];
const DEFAULT_SUBJECTS = [
  { name: "Mathematics", color: "#1F9E8F" },
  { name: "Accounting", color: "#8C3049" },
  { name: "Business Studies", color: "#C06B3E" },
  { name: "Geography", color: "#3070A8" },
  { name: "English Home Language", color: "#3E8A63" },
  { name: "Afrikaans", color: "#6155A8" },
  { name: "Life Orientation", color: "#A98C34" },
];
const CATS = [
  { id: "notes",   label: "My notes",   blank: "Your own PDFs live here. Upload a set and they're on every device you sign in from." },
  { id: "papers",  label: "Past papers", blank: "IEB papers and memos you've collected. Upload them here." },
  { id: "prelims", label: "Other schools' prelims", blank: "Prelim papers from other IEB schools. Upload what you get hold of." },
  { id: "tips",    label: "Tips & links", blank: "" },
];
const SOURCES = [
  { name: "IEB Past Papers Library", href: "https://www.ieb.co.za/pages/pastiebpaperslibrary", note: "Official · last 5 years with marking guidelines · log in as guest" },
  { name: "Advantage Learn — Grade 12 past papers", href: "https://www.advantagelearn.com/grade-12-past-exam-papers/", note: "IEB and DBE papers with memos, free" },
  { name: "SA Papers — IEB", href: "https://www.sapapers.co.za/ieb", note: "Large IEB archive, 2011 onwards, by subject" },
  { name: "MyExamPapers — IEB Grade 12", href: "https://www.myexampapers.co.za/ieb/past-papers/grade-12/", note: "Papers and marking guidelines by year" },
  { name: "ExamSlayers — IEB library", href: "https://examslayers.co.za/past-papers/ieb", note: "Papers with memos, by subject and year" },
];
const DISPLAY = "'Bricolage Grotesque', system-ui, sans-serif";
const MONO = "'JetBrains Mono', ui-monospace, monospace";
const MAX_BYTES = 50 * 1024 * 1024;
const BUCKET = "shelf";

/* ---------------- supabase ---------------- */
const cfg = window.SHELF_CONFIG || {};
const configured = cfg.SUPABASE_URL && !cfg.SUPABASE_URL.includes("YOUR-PROJECT-ID");
const sb = configured ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;

const fmtSize = (n) => n >= 1048576 ? (n/1048576).toFixed(1)+" MB" : Math.max(1, Math.round(n/1024))+" KB";

/* ---------------- icons ---------------- */
const I = (d, extra) => ({ size = 18, style }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor"
       strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" style={style}>
    {d}{extra}
  </svg>
);
const IcFile   = I(<><path d="M14 3v5h5"/><path d="M19 21H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h9l6 6v11a1 1 0 0 1-1 1z"/></>);
const IcOpen   = I(<><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></>);
const IcPrint  = I(<><path d="M7 8V3h10v5"/><path d="M7 17H5a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-2"/><path d="M7 14h10v7H7z"/></>);
const IcDown   = I(<><path d="M12 3v13"/><path d="m7 12 5 5 5-5"/><path d="M4 21h16"/></>);
const IcTrash  = I(<><path d="M4 6h16"/><path d="M9 6V4h6v2"/><path d="M6 6l1 14h10l1-14"/></>);
const IcSearch = I(<><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></>);
const IcPlus   = I(<><path d="M12 5v14"/><path d="M5 12h14"/></>);
const IcBack   = I(<><path d="m14 6-6 6 6 6"/></>);
const IcUp     = I(<><path d="M12 20V7"/><path d="m7 12 5-5 5 5"/><path d="M4 4h16"/></>);
const IcX      = I(<><path d="M6 6l12 12"/><path d="M18 6 6 18"/></>);
const IcCal    = I(<><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></>);
const IcBulb   = I(<><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></>);
const IcLink   = I(<><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></>);

/* ---------------- shared bits ---------------- */
function Eyebrow({ children }) {
  return <div className="text-[11px] uppercase" style={{ fontFamily: MONO, color: C.muted, letterSpacing: "0.16em" }}>{children}</div>;
}
function IconBtn({ icon: Icon, onClick, title }) {
  return (
    <button type="button" onClick={onClick} title={title} aria-label={title}
      className="rounded-md p-2" style={{ color: C.muted }}>
      <Icon size={16} />
    </button>
  );
}

/* ---------------- sign in ---------------- */
function SignIn({ onSent, sent }) {
  const [email, setEmail] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const send = async () => {
    const e = email.trim().toLowerCase();
    if (!e) return setErr("Enter the email address you want to sign in with.");
    const allow = (cfg.ALLOWED_EMAILS || []).map((x) => x.toLowerCase());
    if (allow.length && !allow.includes(e)) return setErr("That address isn't on the list for this shelf.");
    setBusy(true); setErr("");
    const { error } = await sb.auth.signInWithOtp({ email: e, options: { emailRedirectTo: window.location.href } });
    setBusy(false);
    if (error) setErr(error.message); else onSent(e);
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-5" style={{ background: C.bg }}>
      <div className="w-full max-w-sm">
        <div className="flex items-center gap-2">
          {["#1F9E8F","#8C3049","#C06B3E"].map((c,i) => <span key={i} style={{width:4,height:22,background:c,borderRadius:1}} />)}
          <span className="text-xl ml-1" style={{ fontFamily: DISPLAY, fontWeight: 700, letterSpacing: "-0.02em" }}>Shelf</span>
        </div>
        <h1 className="mt-6 text-2xl leading-tight" style={{ fontFamily: DISPLAY, fontWeight: 700, letterSpacing: "-0.03em" }}>
          Sign in to open your shelf.
        </h1>
        {sent ? (
          <p className="mt-4 text-sm" style={{ color: C.muted }}>
            Check <span style={{ color: C.text }}>{sent}</span> for a sign-in link and open it on this device. The link works once and lasts about an hour.
          </p>
        ) : (
          <>
            <p className="mt-3 text-sm" style={{ color: C.muted }}>
              No password. We email you a link that signs you in.
            </p>
            <input
              type="email" value={email} onChange={(e) => setEmail(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && send()}
              placeholder="your email"
              className="mt-5 w-full rounded-md px-3 py-3 text-sm outline-none"
              style={{ background: C.surface, border: `1px solid ${C.line}`, color: C.text }}
            />
            <button onClick={send} disabled={busy}
              className="mt-3 w-full rounded-md px-3 py-3 text-sm disabled:opacity-50"
              style={{ background: C.gold, color: "#171310" }}>
              {busy ? "Sending…" : "Email me a link"}
            </button>
            {err && <p className="mt-3 text-sm" style={{ color: "#EFC9C9" }}>{err}</p>}
          </>
        )}
      </div>
    </div>
  );
}

/* ---------------- app ---------------- */
function App() {
  const [session, setSession] = useState(null);
  const [ready, setReady] = useState(false);
  const [sent, setSent] = useState("");

  const [subjects, setSubjects] = useState([]);
  const [files, setFiles] = useState([]);
  const [notes, setNotes] = useState([]);
  const [view, setView] = useState({ subject: null, cat: "notes" });
  const [query, setQuery] = useState("");
  const [busy, setBusy] = useState(null);
  const [err, setErr] = useState("");
  const [adding, setAdding] = useState(false);
  const [newSubject, setNewSubject] = useState("");
  const [firstPaper, setFirstPaper] = useState(localStorage.getItem("shelf:firstPaper") || "");
  const [dateOpen, setDateOpen] = useState(false);
  const fileInput = useRef(null);

  useEffect(() => {
    if (!sb) { setReady(true); return; }
    sb.auth.getSession().then(({ data }) => { setSession(data.session); setReady(true); });
    const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
    return () => sub.subscription.unsubscribe();
  }, []);

  const load = useCallback(async () => {
    const [s, f, n] = await Promise.all([
      sb.from("subjects").select("*").order("created_at"),
      sb.from("files").select("*").order("created_at", { ascending: false }),
      sb.from("notes").select("*").order("created_at", { ascending: false }),
    ]);
    if (s.error || f.error || n.error) { setErr("Couldn't load your shelf. Refresh and try again."); return; }
    if (!s.data.length) {
      const seeded = await sb.from("subjects").insert(DEFAULT_SUBJECTS).select();
      setSubjects(seeded.data || []);
    } else setSubjects(s.data);
    setFiles(f.data); setNotes(n.data);
  }, []);

  useEffect(() => { if (session) load(); }, [session, load]);

  if (!ready) return <div className="min-h-screen" style={{ background: C.bg }} />;
  if (!configured) return (
    <div className="min-h-screen flex items-center justify-center px-6 text-center" style={{ background: C.bg }}>
      <p className="text-sm max-w-sm" style={{ color: C.muted }}>
        Open <span style={{ color: C.gold, fontFamily: MONO }}>config.js</span> and paste in your Supabase URL and anon key. The README walks through it.
      </p>
    </div>
  );
  if (!session) return <SignIn sent={sent} onSent={setSent} />;

  const uid = session.user.id;
  const subject = subjects.find((s) => s.id === view.subject) || null;

  /* ---- actions ---- */
  const upload = async (list) => {
    const chosen = Array.from(list).filter((f) => f.size > 0);
    for (const f of chosen) {
      if (f.size > MAX_BYTES) { setErr(`${f.name} is over 50 MB, which Supabase won't accept. Split it by topic and upload again.`); continue; }
      setBusy(`Uploading ${f.name}`);
      const path = `${uid}/${crypto.randomUUID()}.pdf`;
      const up = await sb.storage.from(BUCKET).upload(path, f, { contentType: f.type || "application/pdf" });
      if (up.error) { setErr(`${f.name} didn't upload: ${up.error.message}`); setBusy(null); continue; }
      const row = { subject_id: view.subject, cat: view.cat, title: f.name.replace(/\.pdf$/i, ""), size: f.size, path };
      const ins = await sb.from("files").insert(row).select().single();
      if (ins.error) setErr(`${f.name} uploaded but wasn't listed. Refresh the page.`);
      else setFiles((prev) => [ins.data, ...prev]);
      setBusy(null);
    }
  };

  const blobFor = async (file) => {
    setBusy(`Opening ${file.title}`);
    const { data, error } = await sb.storage.from(BUCKET).download(file.path);
    setBusy(null);
    if (error) { setErr(`${file.title} couldn't be fetched.`); return null; }
    return URL.createObjectURL(data);
  };

  const openFile   = async (f) => { const u = await blobFor(f); if (u) window.open(u, "_blank"); };
  const downloadFile = async (f) => {
    const u = await blobFor(f); if (!u) return;
    const a = document.createElement("a"); a.href = u; a.download = `${f.title}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  const printFile = async (f) => {
    const u = await blobFor(f); if (!u) return;
    const frame = document.createElement("iframe");
    Object.assign(frame.style, { position: "fixed", right: 0, bottom: 0, width: 0, height: 0, border: 0 });
    frame.src = u;
    frame.onload = () => { try { frame.contentWindow.focus(); frame.contentWindow.print(); } catch { window.open(u, "_blank"); } };
    document.body.appendChild(frame);
    setTimeout(() => frame.remove(), 60000);
  };
  const removeFile = async (f) => {
    setBusy(`Removing ${f.title}`);
    await sb.storage.from(BUCKET).remove([f.path]);
    const { error } = await sb.from("files").delete().eq("id", f.id);
    setBusy(null);
    if (error) setErr("That file wasn't removed. Try again.");
    else setFiles((prev) => prev.filter((x) => x.id !== f.id));
  };

  const addSubject = async () => {
    const name = newSubject.trim(); if (!name) return;
    const color = PALETTE[subjects.length % PALETTE.length];
    const { data, error } = await sb.from("subjects").insert({ name, color }).select().single();
    if (!error) { setSubjects((p) => [...p, data]); setNewSubject(""); setAdding(false); }
  };

  const addNote = async (row) => {
    const { data, error } = await sb.from("notes").insert(row).select().single();
    if (!error) setNotes((p) => [data, ...p]);
  };
  const delNote = async (id) => {
    const { error } = await sb.from("notes").delete().eq("id", id);
    if (!error) setNotes((p) => p.filter((n) => n.id !== id));
  };

  const counts = files.reduce((m, f) => (m[f.subject_id] = (m[f.subject_id] || 0) + 1, m), {});
  const results = query.trim()
    ? files.filter((f) => f.title.toLowerCase().includes(query.trim().toLowerCase())).slice(0, 40)
    : [];
  const daysLeft = firstPaper ? Math.ceil((new Date(firstPaper + "T08:00:00") - new Date()) / 86400000) : null;

  /* ---- render ---- */
  return (
    <div className="min-h-screen w-full">
      <header className="sticky top-0 z-20 no-print"
        style={{ background: "rgba(14,17,20,0.92)", borderBottom: `1px solid ${C.line}`, backdropFilter: "blur(8px)" }}>
        <div className="mx-auto max-w-5xl px-4 py-3 flex items-center gap-3">
          <button onClick={() => { setView({ subject: null, cat: "notes" }); setQuery(""); }} className="flex items-center gap-2 rounded">
            <span className="inline-flex">
              {["#1F9E8F","#8C3049","#C06B3E"].map((c,i) => <span key={i} style={{width:4,height:20,background:c,marginRight:2,borderRadius:1}} />)}
            </span>
            <span className="text-lg" style={{ fontFamily: DISPLAY, fontWeight: 700, letterSpacing: "-0.02em" }}>Shelf</span>
          </button>
          <div className="ml-auto flex items-center gap-2">
            <div className="hidden sm:flex items-center gap-2 rounded-md px-2 py-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
              <IcSearch size={14} style={{ color: C.muted }} />
              <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search everything"
                className="bg-transparent text-sm outline-none w-40" style={{ color: C.text }} />
            </div>
            <button onClick={() => setDateOpen((v) => !v)} className="flex items-center gap-2 rounded-md px-2 py-1.5 text-xs"
              style={{ background: C.surface, border: `1px solid ${C.line}`, color: daysLeft != null ? C.gold : C.muted, fontFamily: MONO }}>
              <IcCal size={13} />{daysLeft != null ? (daysLeft >= 0 ? `${daysLeft} days` : "writing now") : "set date"}
            </button>
            <button onClick={() => sb.auth.signOut()} className="text-xs rounded-md px-2 py-1.5"
              style={{ color: C.muted, border: `1px solid ${C.line}`, fontFamily: MONO }}>out</button>
          </div>
        </div>

        {dateOpen && (
          <div className="mx-auto max-w-5xl px-4 pb-3 flex items-center gap-2">
            <span className="text-xs" style={{ color: C.muted }}>First paper</span>
            <input type="date" value={firstPaper}
              onChange={(e) => { setFirstPaper(e.target.value); localStorage.setItem("shelf:firstPaper", e.target.value); }}
              className="rounded-md px-2 py-1.5 text-sm outline-none"
              style={{ background: C.surface, border: `1px solid ${C.line}`, color: C.text }} />
          </div>
        )}

        <div className="sm:hidden mx-auto max-w-5xl px-4 pb-3">
          <div className="flex items-center gap-2 rounded-md px-2 py-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <IcSearch size={14} style={{ color: C.muted }} />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search everything"
              className="bg-transparent text-sm outline-none w-full" style={{ color: C.text }} />
          </div>
        </div>
      </header>

      {(busy || err) && (
        <div className="mx-auto max-w-5xl px-4 pt-3 no-print">
          {busy && <div className="rounded-md px-3 py-2 text-sm" style={{ background: C.surface, border: `1px solid ${C.line}`, color: C.muted }}>{busy}…</div>}
          {err && (
            <div className="mt-2 rounded-md px-3 py-2 text-sm flex items-start gap-3" style={{ background: "#241819", border: "1px solid #4A2A2C", color: "#EFC9C9" }}>
              <span className="flex-1">{err}</span>
              <button onClick={() => setErr("")} style={{ color: "#EFC9C9" }}><IcX size={14} /></button>
            </div>
          )}
        </div>
      )}

      <main className="mx-auto max-w-5xl px-4 pb-24 pt-6">
        {query.trim() ? (
          <section>
            <Eyebrow>{results.length} match{results.length === 1 ? "" : "es"}</Eyebrow>
            <div className="mt-4 space-y-2">
              {results.map((f) => (
                <FileRow key={f.id} file={f} subject={subjects.find((s) => s.id === f.subject_id)} showSubject
                  onOpen={openFile} onPrint={printFile} onDownload={downloadFile} onDelete={removeFile} />
              ))}
              {!results.length && <p className="text-sm" style={{ color: C.muted }}>Nothing with that name yet. Try a shorter word, or open the subject and upload it.</p>}
            </div>
          </section>
        ) : !subject ? (
          <section>
            <Eyebrow>IEB · Grade 12 · finals</Eyebrow>
            <h1 className="mt-3 text-3xl sm:text-4xl leading-tight" style={{ fontFamily: DISPLAY, fontWeight: 700, letterSpacing: "-0.03em" }}>
              Every paper, every note,<br />on whatever screen is nearest.
            </h1>
            <p className="mt-3 text-sm max-w-xl" style={{ color: C.muted }}>
              Pick a subject to open its notes, past papers, other schools' prelims and tips.
            </p>
            <div className="mt-8 grid gap-3 sm:grid-cols-2">
              {subjects.map((s) => (
                <button key={s.id} onClick={() => setView({ subject: s.id, cat: "notes" })}
                  className="relative text-left rounded-lg overflow-hidden transition-transform hover:-translate-y-0.5"
                  style={{ background: C.surface, border: `1px solid ${C.line}` }}>
                  <span className="absolute left-0 top-0 bottom-0" style={{ width: 6, background: s.color }} />
                  <span className="absolute left-1.5 top-2 bottom-2 opacity-40" style={{ width: 2, background: s.color }} />
                  <div className="pl-6 pr-4 py-5">
                    <div className="text-lg" style={{ fontFamily: DISPLAY, fontWeight: 500, letterSpacing: "-0.02em" }}>{s.name}</div>
                    <div className="mt-1 text-xs" style={{ fontFamily: MONO, color: C.muted }}>
                      {counts[s.id] || 0} pdf{(counts[s.id] || 0) === 1 ? "" : "s"}
                    </div>
                  </div>
                </button>
              ))}
              {adding ? (
                <div className="rounded-lg p-4" style={{ background: C.surface, border: `1px dashed ${C.line}` }}>
                  <input autoFocus value={newSubject} onChange={(e) => setNewSubject(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && addSubject()} placeholder="Subject name"
                    className="w-full bg-transparent text-sm outline-none pb-2" style={{ color: C.text, borderBottom: `1px solid ${C.line}` }} />
                  <div className="mt-3 flex gap-2">
                    <button onClick={addSubject} className="rounded-md px-3 py-2 text-sm" style={{ background: C.gold, color: "#171310" }}>Add subject</button>
                    <button onClick={() => { setAdding(false); setNewSubject(""); }} className="rounded-md px-3 py-2 text-sm" style={{ color: C.muted, border: `1px solid ${C.line}` }}>Cancel</button>
                  </div>
                </div>
              ) : (
                <button onClick={() => setAdding(true)} className="rounded-lg py-5 px-4 text-sm text-left"
                  style={{ border: `1px dashed ${C.line}`, color: C.muted }}>
                  <IcPlus size={16} style={{ display: "inline", marginRight: 8, verticalAlign: "-3px" }} />Add a subject
                </button>
              )}
            </div>
          </section>
        ) : (
          <section>
            <button onClick={() => setView({ subject: null, cat: "notes" })} className="flex items-center gap-1 text-sm mb-5" style={{ color: C.muted }}>
              <IcBack size={16} /> All subjects
            </button>
            <div className="flex items-center gap-3">
              <span style={{ width: 6, height: 34, background: subject.color, borderRadius: 2 }} />
              <h2 className="text-2xl" style={{ fontFamily: DISPLAY, fontWeight: 700, letterSpacing: "-0.02em" }}>{subject.name}</h2>
            </div>

            <div className="mt-6 flex gap-1 overflow-x-auto pb-1 no-print">
              {CATS.map((c) => {
                const active = view.cat === c.id;
                return (
                  <button key={c.id} onClick={() => setView({ ...view, cat: c.id })}
                    className="whitespace-nowrap rounded-md px-3 py-2 text-sm"
                    style={{ background: active ? C.raised : "transparent", color: active ? C.text : C.muted, border: `1px solid ${active ? subject.color : "transparent"}` }}>
                    {c.label}
                  </button>
                );
              })}
            </div>

            <div className="mt-5">
              {view.cat === "tips" ? (
                <TipsPanel subject={subject} notes={notes.filter((n) => n.subject_id === subject.id)} onAdd={addNote} onDelete={delNote} />
              ) : (
                <FilesPanel
                  subject={subject} cat={view.cat} fileInput={fileInput} onFiles={upload}
                  files={files.filter((f) => f.subject_id === subject.id && f.cat === view.cat)}
                  onOpen={openFile} onPrint={printFile} onDownload={downloadFile} onDelete={removeFile} />
              )}
            </div>
          </section>
        )}
      </main>
    </div>
  );
}

/* ---------------- files ---------------- */
function FilesPanel({ subject, cat, files, fileInput, onFiles, onOpen, onPrint, onDownload, onDelete }) {
  const [drag, setDrag] = useState(false);
  const meta = CATS.find((c) => c.id === cat);
  return (
    <div>
      {(cat === "papers" || cat === "prelims") && (
        <div className="mb-5 rounded-lg overflow-hidden no-print" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="px-4 pt-4"><Eyebrow>Get papers from</Eyebrow></div>
          <ul className="mt-2 pb-2">
            {SOURCES.map((s) => (
              <li key={s.href}>
                <a href={s.href} target="_blank" rel="noreferrer" className="flex items-start gap-3 px-4 py-3" style={{ borderTop: `1px solid ${C.line}` }}>
                  <IcOpen size={15} style={{ color: subject.color, marginTop: 2, flexShrink: 0 }} />
                  <span className="min-w-0">
                    <span className="block text-sm">{s.name}</span>
                    <span className="block text-xs mt-0.5" style={{ color: C.muted }}>{s.note}</span>
                  </span>
                </a>
              </li>
            ))}
          </ul>
          <p className="px-4 pb-4 text-xs" style={{ color: "#5F6871" }}>Download what you need there, then upload it below so it's on every device.</p>
        </div>
      )}

      <div
        onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={(e) => { e.preventDefault(); setDrag(false); onFiles(e.dataTransfer.files); }}
        className="rounded-lg px-4 py-6 text-center no-print"
        style={{ border: `1px dashed ${drag ? subject.color : "#2E3641"}`, background: drag ? C.raised : "transparent" }}>
        <IcUp size={18} style={{ color: C.muted, margin: "0 auto" }} />
        <p className="mt-2 text-sm" style={{ color: C.muted }}>Drop PDFs here, or</p>
        <button onClick={() => fileInput.current?.click()} className="mt-2 rounded-md px-3 py-2 text-sm" style={{ background: subject.color, color: "#0E1114" }}>
          Choose files
        </button>
        <input ref={fileInput} type="file" accept="application/pdf" multiple className="hidden"
          onChange={(e) => { onFiles(e.target.files); e.target.value = ""; }} />
        <p className="mt-3 text-xs" style={{ fontFamily: MONO, color: "#5F6871" }}>up to 50 MB per pdf</p>
      </div>

      <div className="mt-5 space-y-2">
        {files.map((f) => (
          <FileRow key={f.id} file={f} subject={subject} onOpen={onOpen} onPrint={onPrint} onDownload={onDownload} onDelete={onDelete} />
        ))}
        {!files.length && <p className="text-sm py-6" style={{ color: C.muted }}>{meta.blank}</p>}
      </div>
    </div>
  );
}

function FileRow({ file, subject, showSubject, onOpen, onPrint, onDownload, onDelete }) {
  const [confirm, setConfirm] = useState(false);
  return (
    <div className="rounded-lg px-3 py-3 flex items-center gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <span style={{ color: subject?.color || C.muted, flexShrink: 0 }}><IcFile size={18} /></span>
      <div className="min-w-0 flex-1">
        <div className="truncate text-sm">{file.title}</div>
        <div className="text-xs mt-0.5" style={{ fontFamily: MONO, color: C.muted }}>
          {showSubject && subject ? subject.name + " · " : ""}{fmtSize(file.size)}
        </div>
      </div>
      <div className="flex items-center gap-1 shrink-0 no-print">
        <IconBtn icon={IcOpen} title="Open" onClick={() => onOpen(file)} />
        <IconBtn icon={IcPrint} title="Print" onClick={() => onPrint(file)} />
        <IconBtn icon={IcDown} title="Download" onClick={() => onDownload(file)} />
        {confirm
          ? <button onClick={() => onDelete(file)} className="rounded-md px-2 py-1 text-xs" style={{ color: C.danger, border: `1px solid ${C.line}`, fontFamily: MONO }}>remove?</button>
          : <IconBtn icon={IcTrash} title="Remove" onClick={() => setConfirm(true)} />}
      </div>
    </div>
  );
}

/* ---------------- tips + links ---------------- */
function TipsPanel({ subject, notes, onAdd, onDelete }) {
  const [tip, setTip] = useState("");
  const [label, setLabel] = useState("");
  const [url, setUrl] = useState("");
  const tips = notes.filter((n) => n.kind === "tip");
  const links = notes.filter((n) => n.kind === "link");

  return (
    <div className="grid gap-6 sm:grid-cols-2">
      <div>
        <Eyebrow>Exam tips</Eyebrow>
        <div className="mt-3 rounded-lg p-3 no-print" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <textarea value={tip} onChange={(e) => setTip(e.target.value)} rows={3}
            placeholder="What does the examiner actually want in this section?"
            className="w-full bg-transparent text-sm outline-none resize-none" style={{ color: C.text }} />
          <div className="flex justify-end">
            <button onClick={() => { if (tip.trim()) { onAdd({ subject_id: subject.id, kind: "tip", text: tip.trim() }); setTip(""); } }}
              className="rounded-md px-3 py-1.5 text-sm" style={{ background: subject.color, color: "#0E1114" }}>Save tip</button>
          </div>
        </div>
        <ul className="mt-3 space-y-2">
          {tips.map((t) => (
            <li key={t.id} className="rounded-lg px-3 py-3 flex gap-3 text-sm" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
              <IcBulb size={16} style={{ color: subject.color, flexShrink: 0, marginTop: 2 }} />
              <span className="flex-1 whitespace-pre-wrap">{t.text}</span>
              <button className="no-print" onClick={() => onDelete(t.id)} style={{ color: C.muted }} aria-label="Delete tip"><IcX size={14} /></button>
            </li>
          ))}
          {!tips.length && <p className="text-sm" style={{ color: C.muted }}>No tips saved yet. Add the ones your teacher repeats.</p>}
        </ul>
      </div>

      <div>
        <Eyebrow>Links</Eyebrow>
        <div className="mt-3 rounded-lg p-3 space-y-2 no-print" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <input value={label} onChange={(e) => setLabel(e.target.value)} placeholder="Name, e.g. school past paper drive"
            className="w-full bg-transparent text-sm outline-none pb-2" style={{ color: C.text, borderBottom: `1px solid ${C.line}` }} />
          <input value={url} onChange={(e) => setUrl(e.target.value)} placeholder="Paste the link"
            className="w-full bg-transparent text-sm outline-none pb-2" style={{ color: C.text, borderBottom: `1px solid ${C.line}` }} />
          <div className="flex justify-end pt-1">
            <button
              onClick={() => {
                const u = url.trim(); if (!u) return;
                const href = /^https?:\/\//i.test(u) ? u : "https://" + u;
                onAdd({ subject_id: subject.id, kind: "link", text: label.trim() || href, href });
                setLabel(""); setUrl("");
              }}
              className="rounded-md px-3 py-1.5 text-sm" style={{ background: subject.color, color: "#0E1114" }}>Save link</button>
          </div>
        </div>
        <ul className="mt-3 space-y-2">
          {links.map((l) => (
            <li key={l.id} className="rounded-lg px-3 py-3 flex items-center gap-3 text-sm" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
              <IcLink size={16} style={{ color: subject.color, flexShrink: 0 }} />
              <a href={l.href} target="_blank" rel="noreferrer" className="flex-1 truncate underline" style={{ color: C.text }}>{l.text}</a>
              <button className="no-print" onClick={() => onDelete(l.id)} style={{ color: C.muted }} aria-label="Delete link"><IcX size={14} /></button>
            </li>
          ))}
          {!links.length && <p className="text-sm" style={{ color: C.muted }}>Nothing saved. Paste the drive or site you pull papers from.</p>}
        </ul>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
